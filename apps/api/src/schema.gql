  currentProjectForVehicle(vehicleId: String!): Project

  """High-level KPIs for the main dashboard"""
  dashboardMetrics: DashboardMetrics!

  """Get an employee by ID"""
  employee(id: String!): Employee

  """Get an employee by user ID"""
  employeeByUserId(userId: String!): Employee
  employeeReport: [EmployeeReportRow!]!

  """Get all employees (paginated)"""
  employees(pagination: PaginationInput): PaginatedEmployee!

  """Get employees by department"""
  employeesByDepartment(department: Department!): [Employee!]!
  expiringDocuments(daysAhead: Int!): [ExpiringDocumentSummary!]!

  """Aging analysis for outstanding invoice amounts"""
  financeAgingSummary: [FinanceAgingBucket!]!
  fleetReport: [FleetReportRow!]!

  """Aggregated leave requests by status"""
  hrLeaveSummary: [HrLeaveSummary!]!
  inTransitByProduct(productId: ID!, warehouseId: ID): [InTransitRow!]!
  inTransitSummary(warehouseId: ID): [InTransitProductSummary!]!

  """Get an invoice by ID"""
  invoice(id: String!): Invoice

  """Get all invoices (paginated)"""
  invoices(pagination: PaginationInput): PaginatedInvoice!

  """Get a leave request by ID"""
  leaveRequest(id: String!): LeaveRequest

  """Get all leave requests"""
  leaveRequests: [LeaveRequest!]!

  """Get products below minimum stock"""
  lowStockProducts: [Product!]!
  me: User!
  mileageLogs(vehicleId: String!): [MileageLog!]!

  """Get current user employee profile"""
  myEmployeeProfile: Employee

  """Get leave requests of current user"""
  myLeaveRequests: [LeaveRequest!]!
  myNotifications(filter: NotificationFilterInput, pagination: PaginationInput): PaginatedNotification!
  myProjectTasks: [ProjectTask!]!

  """Get subordinates of current user (if manager)"""
  mySubordinates: [Employee!]!
  myUnreadNotificationCount: Int!

  """Get a partner by ID"""
  partner(id: String!): Partner

  """Get all partners (paginated)"""
  partners(pagination: PaginationInput): PaginatedPartner!

  """Get pending leave requests for current user subordinates"""
  pendingLeaveRequestsForManager: [LeaveRequest!]!

  """Per-warehouse stock breakdown for a product"""
  productStockByProduct(productId: String!): [ProductStock!]!

  """Get all products (paginated)"""
  products(pagination: PaginationInput, search: String): PaginatedProduct!
  project(projectId: String!): Project!
  projectCostRollup(projectId: String!): ProjectCostRollup!

  """
  Returns draft invoice line items aggregated from a project (issued materials + tagged vehicle expenses)
  """
  projectCostsForInvoice(projectId: String!): [InvoiceLineDraft!]!
  projectFeed(kind: ProjectFeedKind, projectId: String!): [ProjectFeedEntry!]!
  projectMaterials(projectId: String!): [ProjectMaterial!]!
  projectMembers(projectId: String!): [ProjectMember!]!
  projectTaskActivity(taskId: String!): [ProjectFeedEntry!]!
  projectTaskComments(taskId: String!): [ProjectTaskComment!]!
  projectTasks(projectId: String!): [ProjectTask!]!
  projectVehicles(projectId: String!): [ProjectVehicle!]!
  projects(filter: ProjectsFilterInput): [Project!]!
  purchaseOrder(id: ID!): PurchaseOrder!
  purchaseOrders(filter: PurchaseOrderFilterInput, pagination: PaginationInput): PaginatedPurchaseOrder!

  """Get stock movements by optional filters"""
  stockMovements(filter: StockMovementFilterInput, pagination: PaginationInput): [StockMovement!]!

  """Inventory overview KPIs"""
  stockOverview: StockOverview!
  stockReport: [StockReportRow!]!

  """Get a user by ID"""
  user(id: String!): User

  """Get all users"""
  users: [User!]!
  vehicle(id: String!): Vehicle
  vehicleDocuments(vehicleId: String!): [VehicleDocument!]!
  vehicleExpenses(vehicleId: String!): [VehicleExpense!]!
  vehicleLeases(vehicleId: String!): [VehicleLease!]!
  vehicles(pagination: PaginationInput): PaginatedVehicle!

  """Get all warehouses (paginated)"""
  warehouses(pagination: PaginationInput): PaginatedWarehouse!
}

