services:
  # Backend API - NestJS GraphQL Server
  - type: web
    name: corpex-api
    runtime: node
    rootDir: apps/api
    buildCommand: npm install -g bun && NODE_ENV=development bun install && bunx prisma generate && bun run build
    startCommand: node dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        sync: false # Set manually in Render dashboard
      - key: JWT_SECRET
        sync: false # Set manually in Render dashboard
      - key: CORS_ORIGIN
        sync: false # Set to the frontend URL after deploying

  # Frontend - React Vite Static Site
  - type: web
    name: corpex-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm install -g bun && bun install && bun run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Set to https://corpex-api.onrender.com/graphql after deploying
